<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>האפליקציות שלי</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-white" style="background: radial-gradient(circle at 0% 100%, #1e3a8a 0%, #0f172a 35%, #05070d 100%);">
  <div class="max-w-md mx-auto p-4 pb-10">
    <p id="loading" class="text-center text-gray-400 mt-8">טוען אפליקציות...</p>

    <div id="error-message" class="hidden text-center mt-8">
      <p id="error-text" class="text-red-300 mb-3">אירעה שגיאה בטעינת הריפואים מ-GitHub. בדקו את החיבור לאינטרנט ונסו שוב.</p>
      <button id="retry-btn" class="rounded-lg bg-gray-700 px-4 py-2 text-sm font-medium active:bg-gray-600">
        נסה שוב
      </button>
    </div>

    <p id="empty-message" class="hidden text-center text-gray-400 mt-8">אין ריפואים להצגה</p>

    <div id="apps-grid" class="grid grid-cols-3 gap-x-2 gap-y-5 mt-2"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
