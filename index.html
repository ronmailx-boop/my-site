<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>רשימת קניות</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-center my-4">🛒 רשימת קניות</h1>

    <form id="add-form" class="flex gap-2 mb-4">
      <input
        id="name-input"
        type="text"
        placeholder="שם מוצר"
        required
        class="flex-1 min-w-0 rounded-lg border border-gray-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
      <input
        id="quantity-input"
        type="number"
        min="1"
        value="1"
        class="w-16 rounded-lg border border-gray-300 px-2 py-3 text-base text-center focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
      <button
        type="submit"
        class="rounded-lg bg-blue-600 text-white px-4 py-3 text-base font-medium active:bg-blue-700"
      >
        הוסף
      </button>
    </form>

    <button
      id="clear-purchased-btn"
      class="w-full mb-4 rounded-lg bg-gray-200 text-gray-700 px-4 py-2 text-sm font-medium active:bg-gray-300 hidden"
    >
      ניקוי מוצרים שנקנו
    </button>

    <ul id="list" class="space-y-2"></ul>

    <p id="empty-message" class="text-center text-gray-400 mt-8">הרשימה ריקה</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
